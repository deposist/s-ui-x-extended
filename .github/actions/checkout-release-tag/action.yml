name: Checkout release tag
description: Validate and check out the exact annotated or lightweight release tag

inputs:
  tag:
    description: Release tag selected from workflow input or the tag push
    required: true
  expected_commit:
    description: Previously resolved tag commit; downstream jobs fail if the tag moved
    required: false
    default: ""
  event_commit:
    description: Tag-push event commit; empty for manual dispatch
    required: false
    default: ""

outputs:
  tag:
    description: Validated release tag
    value: ${{ steps.verify.outputs.tag }}
  commit:
    description: Commit referenced by the release tag
    value: ${{ steps.verify.outputs.commit }}
  version:
    description: Version read from config/version
    value: ${{ steps.verify.outputs.version }}
  prerelease:
    description: Whether the validated SemVer tag has a hyphen prerelease suffix
    value: ${{ steps.verify.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Validate release tag
      id: input
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: echo "tag=$(bash scripts/validate-release-tag.sh "$INPUT_TAG")" >> "$GITHUB_OUTPUT"

    - name: Stage trusted release verifier
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/s-ui-release-tooling"
        cp scripts/validate-release-tag.sh scripts/verify-release-tag-checkout.sh scripts/check-release-state.sh "$RUNNER_TEMP/s-ui-release-tooling/"
        chmod +x "$RUNNER_TEMP/s-ui-release-tooling/validate-release-tag.sh" "$RUNNER_TEMP/s-ui-release-tooling/verify-release-tag-checkout.sh" "$RUNNER_TEMP/s-ui-release-tooling/check-release-state.sh"

    - name: Check out release tag
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: refs/tags/${{ steps.input.outputs.tag }}
        fetch-depth: 0
        submodules: recursive

    - name: Verify release ref and version
      id: verify
      shell: bash
      env:
        TAG: ${{ steps.input.outputs.tag }}
        EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        EVENT_COMMIT: ${{ inputs.event_commit }}
      run: |
        set -euo pipefail
        output=$("$RUNNER_TEMP/s-ui-release-tooling/verify-release-tag-checkout.sh" "$TAG" "$EXPECTED_COMMIT" "$EVENT_COMMIT")
        TAG_COMMIT=$(sed -n 's/^commit=//p' <<<"$output")
        VERSION=$(sed -n 's/^version=//p' <<<"$output")
        PRERELEASE=$("$RUNNER_TEMP/s-ui-release-tooling/validate-release-tag.sh" --prerelease "$TAG")
        {
          echo "tag=$TAG"
          echo "commit=$TAG_COMMIT"
          echo "version=$VERSION"
          echo "prerelease=$PRERELEASE"
        } >> "$GITHUB_OUTPUT"
