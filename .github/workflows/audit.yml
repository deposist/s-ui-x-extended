name: Audit Dashboard

on:
  workflow_run:
    workflows: ["Audit Go"]
    types: [completed]
    branches: [main, s-ui-x-extended]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Audit Go workflow run ID to aggregate"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: audit-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted dashboard tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download audit job artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-go-!(dashboard)
          path: tests/baseline
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build audit dashboard
        shell: bash
        run: bash scripts/audit/aggregate.sh
      - name: Upload dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-dashboard
          path: |
            tests/baseline/phase8/summary.html
            tests/baseline/phase8/summary.json
            tests/baseline/phase8/aggregate.junit.xml
          if-no-files-found: ignore
          retention-days: 30
