name: Audit Go

on:
  pull_request:
  push:
    branches:
      - main
      - s-ui-x-extended
    tags:
      - "v*"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  MAKE_PS: pwsh -NoProfile -ExecutionPolicy Bypass
  STATICCHECK_VERSION: "2026.1"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOSEC_VERSION: "v2.28.0"
  GOVULNCHECK_VERSION: "v1.6.0"

jobs:
  frontend-assets:
    name: frontend-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:build
        shell: bash
        run: make audit:build PS="${MAKE_PS}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-build-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
            tests/baseline/phase*/coverage/**
            tests/baseline/phase*/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  vet:
    name: vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:vet
        shell: bash
        run: make audit:vet PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-vet-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go:
    name: test-go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:test-go
        shell: bash
        run: make audit:test-go PS="${MAKE_PS}"
      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-test-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go-race:
    name: test-go-race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:test-go-race
        shell: bash
        run: make audit:test-go-race PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-race-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: frontend-assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: make audit:cover
        shell: bash
        run: make audit:cover PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-coverage
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
            tests/baseline/phase*/coverage/**
            tests/baseline/phase*/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  lint-go:
    name: lint-go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install Go lint tools
        shell: bash
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make audit:lint-go
        shell: bash
        run: make audit:lint-go PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-lint-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  staticcheck:
    name: staticcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Install staticcheck
        shell: bash
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: staticcheck
        shell: bash
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/baseline/run-command.ps1 -Phase phase8 -Name staticcheck -CommandLine "staticcheck ./..."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-staticcheck-${{ matrix.os }}
          path: |
            tests/baseline/phase8/staticcheck.txt
            tests/baseline/phase8/staticcheck.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  gosec:
    name: gosec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install gosec
        shell: bash
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make audit:gosec
        shell: bash
        run: make audit:gosec PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-gosec-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-frontend-dist
          path: web/html
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install govulncheck
        shell: bash
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make audit:vuln
        shell: bash
        run: make audit:vuln PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-govulncheck-${{ matrix.os }}
          path: |
            tests/baseline/phase*/*.txt
            tests/baseline/phase*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - vet
      - test-go
      - test-go-race
      - coverage
      - lint-go
      - staticcheck
      - gosec
      - govulncheck
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download audit job artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-go-*
          path: .
          merge-multiple: true
      - name: Require every audit job to succeed
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VET_RESULT: ${{ needs.vet.result }}
          TEST_RESULT: ${{ needs.test-go.result }}
          RACE_RESULT: ${{ needs.test-go-race.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          LINT_RESULT: ${{ needs.lint-go.result }}
          STATICCHECK_RESULT: ${{ needs.staticcheck.result }}
          GOSEC_RESULT: ${{ needs.gosec.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
        run: |
          set -euo pipefail
          for result in "$BUILD_RESULT" "$VET_RESULT" "$TEST_RESULT" "$RACE_RESULT" "$COVERAGE_RESULT" "$LINT_RESULT" "$STATICCHECK_RESULT" "$GOSEC_RESULT" "$GOVULNCHECK_RESULT"; do
            test "$result" = success
          done
      - name: Build audit dashboard
        shell: bash
        run: bash scripts/audit/aggregate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-dashboard
          path: |
            tests/baseline/phase8/summary.html
            tests/baseline/phase8/summary.json
            tests/baseline/phase8/aggregate.junit.xml
          if-no-files-found: ignore
          retention-days: 30
