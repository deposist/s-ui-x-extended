name: Build S-UI for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.1"
        type: string
  workflow_call:
    inputs:
      tag:
        description: Validated release tag from the caller
        required: true
        type: string
      expected_commit:
        description: Commit already resolved by the calling release workflow
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "25"
  TAGS: "with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_tailscale,with_dhcp,with_wireguard,with_masque,with_mtproxy,with_openvpn,with_sudoku,with_trusttunnel,with_ccm,with_ocm,with_oomkiller"
  # Pinned, immutable cronet-go release tag (not releases/latest). The .dll is
  # dlopen'd in-process by the root core, so it is verified by sha256 below.
  LIBCRONET_BASE_URL: "https://github.com/SagerNet/cronet-go/releases/download/v148.0.7778.96-1"

jobs:
  release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.checkout.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
      version: ${{ steps.checkout.outputs.version }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        id: checkout
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}
          expected_commit: ${{ inputs.expected_commit || '' }}

  build-frontend:
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (strict)
        working-directory: frontend
        run: npm ci

      - name: Frontend lint (no warnings)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production frontend dist
        working-directory: frontend
        run: npm run verify:dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-windows:
    needs: [release-ref, build-frontend]
    name: Build-windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { arch: amd64, runner: windows-latest, cgo: "1" }
          - { arch: arm64, runner: ubuntu-latest, cgo: "0" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Build s-ui
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}

          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH

          go build -ldflags="-w -s -checklinkname=0" -tags "${{ env.TAGS }}" -o sui.exe main.go
          FILE_INFO=$(file sui.exe)
          echo "$FILE_INFO"
          case "${{ matrix.arch }}" in
            amd64) grep -q 'PE32+ executable.*x86-64' <<<"$FILE_INFO" ;;
            arm64) grep -q 'PE32+ executable.*Aarch64' <<<"$FILE_INFO" ;;
            *) echo "unsupported Windows architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            EXPECTED_VERSION="${{ needs.release-ref.outputs.tag }}"
            test "$(./sui.exe -v | awk 'NR == 1 { print $NF }')" = "${EXPECTED_VERSION#v}"
          fi

          mkdir s-ui-windows
          cp sui.exe s-ui-windows/
          cp windows/install-windows.bat windows/s-ui-windows.bat windows/uninstall-windows.bat windows/s-ui-windows.xml windows/README.md s-ui-windows/

      - name: Download and verify libcronet-go
        shell: bash
        run: |
          set -euo pipefail
          # Pinned release tag (env.LIBCRONET_BASE_URL) + sha256 verification.
          # Asset digests captured from the GitHub release API; update the tag and
          # hashes together. Fail closed on download error, hash, or PE mismatch.
          case "${{ matrix.arch }}" in
            amd64) CRONET_SHA256="c7434cfa93c3041321dd19111c4de6c52b8a9531a65661ba45425d3c51ec69e2"; PE_ARCH='x86-64' ;;
            arm64) CRONET_SHA256="fc9e3bae0b326d83092a5de2c04d8b4139dc5c1ba576a035dee4bde780a3c95f"; PE_ARCH='Aarch64' ;;
            *) echo "no pinned libcronet sha256 for arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error -o s-ui-windows/libcronet.dll "${{ env.LIBCRONET_BASE_URL }}/libcronet-windows-${{ matrix.arch }}.dll"
          echo "${CRONET_SHA256}  s-ui-windows/libcronet.dll" | sha256sum --check --strict -
          file s-ui-windows/libcronet.dll | grep -q "PE32+ executable.*${PE_ARCH}"

      - name: Package and verify exact archive inventory
        shell: python
        run: |
          import shutil
          import zipfile

          archive = shutil.make_archive("s-ui-windows-${{ matrix.arch }}", "zip", "s-ui-windows")
          expected = {
              "README.md", "install-windows.bat", "libcronet.dll", "s-ui-windows.bat",
              "s-ui-windows.xml", "sui.exe", "uninstall-windows.bat",
          }
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("Windows ZIP contains duplicate entries")
              if set(names) != expected:
                  raise SystemExit(f"Windows ZIP inventory mismatch: got={sorted(names)!r}")
              for info in package.infolist():
                  if info.is_dir() or info.filename.startswith(("/", "\\")) or ".." in info.filename.replace("\\", "/").split("/"):
                      raise SystemExit(f"unsafe Windows ZIP entry: {info.filename!r}")
          print(f"Verified final package inventory: {archive}")

      - name: Verify final Windows package runtime and architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "s-ui-windows-${{ matrix.arch }}.zip"
          $unpack = Join-Path $PWD "verified-${{ matrix.arch }}"
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'amd64') { 0x8664 } else { 0xAA64 }
          foreach ($relativePath in @('sui.exe', 'libcronet.dll')) {
            $path = Join-Path $unpack $relativePath
            $stream = [System.IO.File]::OpenRead($path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              if ($reader.ReadUInt16() -ne 0x5A4D) { throw "$relativePath is not an MZ executable" }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadUInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) { throw "$relativePath has no PE signature" }
              $machine = $reader.ReadUInt16()
              if ($machine -ne $expectedMachine) { throw ("{0} machine 0x{1:X4}, expected 0x{2:X4}" -f $relativePath, $machine, $expectedMachine) }
            } finally {
              $stream.Dispose()
            }
          }
          if ('${{ matrix.arch }}' -eq 'amd64') {
            $expectedVersion = '${{ needs.release-ref.outputs.tag }}'.TrimStart('v')
            $versionLine = & (Join-Path $unpack 'sui.exe') -v | Select-Object -First 1
            $versionExitCode = $LASTEXITCODE
            $actualVersion = ($versionLine.Split()[-1]).Trim()
            if ($versionExitCode -ne 0 -or $actualVersion -ne $expectedVersion) {
              throw "packaged amd64 runtime version $actualVersion (exit $versionExitCode), expected $expectedVersion"
            }
          }

      - name: Generate Windows SHA256 checksum
        shell: bash
        run: sha256sum s-ui-windows-${{ matrix.arch }}.zip > s-ui-windows-${{ matrix.arch }}.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s-ui-windows-${{ matrix.arch }}
          path: |
            ./s-ui-windows-${{ matrix.arch }}.zip
            ./s-ui-windows-${{ matrix.arch }}.zip.sha256
          retention-days: 1
