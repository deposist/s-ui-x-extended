name: Release S-UI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.2"
        type: string
  push:
    tags:
      - "v*"

# Default every job to read-only; sensitive rights are job-scoped.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "25"
  CRONET_GO_VERSION: "2faf34666c2cc8234f10f2ab6d4c4d6104d34ae2"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git
  # Exact Bootlin releases; archive URLs and SHA-256 values are published by
  # Bootlin beside each archive. Never replace these with directory scraping.
  BOOTLIN_ARMV5_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--musl--stable-2025.08-1.tar.xz
  BOOTLIN_ARMV5_SHA256: 8cdb4ad70c6b5a66427fa3315fe3ddde1c19c90232674dec59045e04d2a36cf1
  BOOTLIN_S390X_URL: https://toolchains.bootlin.com/downloads/releases/toolchains/s390x-z13/tarballs/s390x-z13--musl--stable-2025.08-1.tar.xz
  BOOTLIN_S390X_SHA256: 23f536ff2bf1a9d3b93210465471996bc7c918fbb5702a277d8e1e42ffab8559
  # Full extended tags that do not need the cronet/naive toolchain. The build
  # step appends with_naive_outbound only for matrix.naive platforms.
  RELEASE_BUILD_TAGS: "with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale,with_dhcp,with_wireguard,with_masque,with_mtproxy,with_openvpn,with_sudoku,with_trusttunnel,with_ccm,with_ocm,with_oomkiller"

jobs:
  release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.checkout.outputs.tag }}
      version: ${{ steps.checkout.outputs.version }}
      commit: ${{ steps.checkout.outputs.commit }}
      prerelease: ${{ steps.checkout.outputs.prerelease }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        id: checkout
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

  build-windows:
    needs: release-ref
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ needs.release-ref.outputs.tag }}
      expected_commit: ${{ needs.release-ref.outputs.commit }}

  awg-integration:
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: AWG 2.0 live WireGuard integration
        run: sudo -E "$(command -v go)" test -tags="integration with_wireguard with_gvisor" ./core -run TestAWG2ServerEndpoint -count=1

  build-frontend:
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Strict, fail-closed install: a desynced package-lock.json aborts the
      # release here instead of silently shipping an unvalidated bundle.
      # `npm install` (lenient) previously masked a lockfile desync and shipped
      # an inconsistent dist with a dangling chunk -> 404 -> black screen
      # (v1.5.7-beta6). Mirror the same gates CI runs so a release can never
      # carry a frontend that CI would reject.
      - name: Install frontend dependencies (strict)
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production frontend dist
        working-directory: frontend
        run: npm run verify:dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  security-gate:
    name: Source security gate
    needs: [release-ref, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned security and lint tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Blocking source checks
        run: |
          go vet ./...
          go test ./...
          staticcheck ./...
          golangci-lint run
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gosec-packages.ps1
          govulncheck ./...

  build-linux:
    name: Build-${{ matrix.platform }}
    needs: [release-ref, build-frontend, awg-integration, security-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, arch: amd64, naive: true }
          - { platform: arm64, arch: arm64, naive: true }
          - { platform: armv7, arch: arm, goarm: "7", naive: true }
          - { platform: armv6, arch: arm, goarm: "6", naive: true }
          - { platform: armv5, arch: arm, goarm: "5", naive: false, bootlin_url: "BOOTLIN_ARMV5_URL", bootlin_sha256: "BOOTLIN_ARMV5_SHA256", bootlin_dir: "armv5-eabi--musl--stable-2025.08-1" }
          - { platform: "386", arch: "386", naive: true }
          - { platform: s390x, arch: s390x, naive: false, bootlin_url: "BOOTLIN_S390X_URL", bootlin_sha256: "BOOTLIN_S390X_SHA256", bootlin_dir: "s390x-z13--musl--stable-2025.08-1" }
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Clone cronet-go (naive platforms)
        if: matrix.naive
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin ${{ env.CRONET_GO_REPO }}
          git -C ~/cronet-go fetch --depth=1 origin "${{ env.CRONET_GO_VERSION }}"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring (cronet sysroot)
        if: matrix.naive
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Build cronet library and set toolchain environment
        if: matrix.naive
        run: |
          set -e
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: Set Go build environment
        run: |
          {
            echo "CGO_ENABLED=1"
            echo "GOOS=linux"
            echo "GOARCH=${{ matrix.arch }}"
            if [ -n "${{ matrix.goarm }}" ]; then echo "GOARM=${{ matrix.goarm }}"; fi
          } >> "$GITHUB_ENV"

      - name: Set up Bootlin musl (non-naive platforms)
        if: ${{ matrix.naive != true }}
        env:
          BOOTLIN_URL_KEY: ${{ matrix.bootlin_url }}
          BOOTLIN_SHA256_KEY: ${{ matrix.bootlin_sha256 }}
          BOOTLIN_DIR: ${{ matrix.bootlin_dir }}
        run: |
          set -euo pipefail
          BOOTLIN_URL=${!BOOTLIN_URL_KEY-}
          BOOTLIN_SHA256=${!BOOTLIN_SHA256_KEY-}
          [[ "$BOOTLIN_URL" == https://toolchains.bootlin.com/downloads/releases/toolchains/*/tarballs/*.tar.xz ]] || {
            echo "missing or non-authoritative exact Bootlin URL for ${{ matrix.platform }}" >&2
            exit 1
          }
          [[ "$BOOTLIN_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "missing pinned Bootlin SHA-256 for ${{ matrix.platform }}" >&2
            exit 1
          }
          [[ "$BOOTLIN_DIR" != "" ]] || { echo "missing exact Bootlin directory" >&2; exit 1; }
          archive="/tmp/${BOOTLIN_URL##*/}"
          curl --fail --location --silent --show-error --output "$archive" "$BOOTLIN_URL"
          printf '%s  %s\n' "$BOOTLIN_SHA256" "$archive" | sha256sum --check --strict -
          tar -xf "$archive" -C /tmp
          TOOLCHAIN_DIR="/tmp/$BOOTLIN_DIR"
          [[ -d "$TOOLCHAIN_DIR" ]] || { echo "expected toolchain directory not found: $TOOLCHAIN_DIR" >&2; exit 1; }
          BIN_DIR="$TOOLCHAIN_DIR/bin"
          echo "PATH=$BIN_DIR:$PATH" >> "$GITHUB_ENV"
          CC=$(find "$BIN_DIR" -maxdepth 1 \( -name '*-gcc.br_real' -o -name '*-gcc' \) -type f -executable 2>/dev/null | grep -v g++ | head -n1)
          [[ -n "$CC" ]] || { echo "gcc not found in $BIN_DIR" >&2; exit 1; }
          echo "CC=$(realpath "$CC")" >> "$GITHUB_ENV"
          SYSROOT=""
          F=$(find "$TOOLCHAIN_DIR" -name "libc-header-start.h" 2>/dev/null | head -1)
          if [[ -n "$F" ]]; then SYSROOT=$(dirname "$(dirname "$(dirname "$(dirname "$F")")")"); fi
          if [[ -n "$SYSROOT" && -d "$SYSROOT" ]]; then
            echo "CGO_CFLAGS=--sysroot=$SYSROOT" >> "$GITHUB_ENV"
            echo "CGO_LDFLAGS=--sysroot=$SYSROOT -static" >> "$GITHUB_ENV"
          fi

      - name: Build s-ui
        run: |
          set -e
          BUILD_TAGS="${{ env.RELEASE_BUILD_TAGS }}"
          [ "${{ matrix.naive }}" = "true" ] && BUILD_TAGS="${BUILD_TAGS},with_naive_outbound,with_musl"
          go build -ldflags="-w -s -checklinkname=0 -linkmode external -extldflags '-static' -X github.com/deposist/s-ui-x-extended/config.ArtifactPlatform=${{ matrix.platform }}" -tags "$BUILD_TAGS" -o sui main.go
          file sui
          ldd sui 2>/dev/null || echo "Static binary confirmed"
          if [ "${{ matrix.platform }}" = "amd64" ]; then
            test "$(./sui -v | awk 'NR == 1 { print $NF }')" = "${{ needs.release-ref.outputs.version }}"
          fi

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp s-ui.sh s-ui/

      - name: Scan representative release build
        if: matrix.platform == 'amd64'
        run: |
          set -euo pipefail
          BUILD_TAGS="${{ env.RELEASE_BUILD_TAGS }},with_naive_outbound,with_musl"
          go build -ldflags="-checklinkname=0 -linkmode external -extldflags '-static' -X github.com/deposist/s-ui-x-extended/config.ArtifactPlatform=${{ matrix.platform }}" -tags "$BUILD_TAGS" -o sui-security-scan main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" -mode=binary sui-security-scan
          rm sui-security-scan

      - name: Package
        run: tar -zcvf s-ui-linux-${{ matrix.platform }}.tar.gz s-ui

      - name: Generate SHA256 checksum
        run: sha256sum s-ui-linux-${{ matrix.platform }}.tar.gz > s-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Generate self-update manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.release-ref.outputs.tag }}"
          tag="${tag#v}"
          channel=main
          [[ "$tag" == *-* ]] && channel=beta
          archive="s-ui-linux-${{ matrix.platform }}.tar.gz"
          manifest="$archive.manifest.json"
          python3 - <<PY
          import hashlib, json
          archive = "$archive"
          with open(archive, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          with open("$manifest", "w", encoding="utf-8") as f:
              json.dump({"version":"$tag", "channel":"$channel", "platform":"${{ matrix.platform }}", "filename":archive, "sha256":digest}, f, separators=(",", ":"))
              f.write("\n")
          PY


      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s-ui-linux-${{ matrix.platform }}
          path: |
            ./s-ui-linux-${{ matrix.platform }}.tar.gz
            ./s-ui-linux-${{ matrix.platform }}.tar.gz.sha256
            ./s-ui-linux-${{ matrix.platform }}.tar.gz.manifest.json
          retention-days: 1

  publish-release:
    permissions:
      contents: write
    name: Reconcile and publish verified release
    needs: [release-ref, build-linux, build-windows, release-security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Set release properties
        id: vars
        env:
          TAG: ${{ needs.release-ref.outputs.tag }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$PRERELEASE" == true ]]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi
          NOTES_FILE=".github/RELEASE_NOTES_${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            : > "$RUNNER_TEMP/empty-release-notes.md"
            echo "notes_path=$RUNNER_TEMP/empty-release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Linux build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: s-ui-linux-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: s-ui-windows-*
          path: release-assets
          merge-multiple: true

      - name: Download release security assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-security-assets
          path: release-assets
      - name: Verify exact local release asset inventory
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 27
          test "$(find release-assets -maxdepth 1 -type f -name 's-ui-linux-*.tar.gz' | wc -l)" -eq 7
          test "$(find release-assets -maxdepth 1 -type f -name 's-ui-linux-*.tar.gz.sha256' | wc -l)" -eq 7
          test "$(find release-assets -maxdepth 1 -type f -name 's-ui-linux-*.tar.gz.manifest.json' | wc -l)" -eq 7
          test "$(find release-assets -maxdepth 1 -type f -name 's-ui-windows-*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 's-ui-windows-*.zip.sha256' | wc -l)" -eq 2
          test -f release-assets/s-ui-release.spdx.json
          test -f release-assets/s-ui-release-attestation.json


      - name: Verify local checksums
        working-directory: release-assets
        run: sha256sum --check --strict s-ui-linux-*.sha256 s-ui-windows-*.sha256

      - name: Recheck authoritative remote tag
        env:
          TAG: ${{ needs.release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.release-ref.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$EXPECTED_COMMIT"

      - name: Create or validate Release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          COMMIT: ${{ needs.release-ref.outputs.commit }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
          NOTES_PATH: ${{ steps.vars.outputs.notes_path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isPrerelease /tmp/release.json)" = "$PRERELEASE"
          else
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$COMMIT" --title "s-ui $TAG" --notes-file "$NOTES_PATH" --draft --latest=false)
            [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > /tmp/release.json
          echo "is_draft=$(jq -r .isDraft /tmp/release.json)" >> "$GITHUB_OUTPUT"

      - name: Reconcile release assets by authoritative digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
        run: bash scripts/check-release-assets.sh "$GITHUB_REPOSITORY" "$TAG" release-assets

      - name: Verify exact remote inventory and digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
        run: bash scripts/check-release-assets.sh --verify "$GITHUB_REPOSITORY" "$TAG" release-assets

      - name: Recheck tag and publish Release
        if: steps.create-release.outputs.is_draft != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.release-ref.outputs.commit }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.vars.outputs.make_latest }}
          NOTES_PATH: ${{ steps.vars.outputs.notes_path }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$EXPECTED_COMMIT"
          args=(release edit "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "s-ui $TAG" --notes-file "$NOTES_PATH" --draft=false)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          elif [[ "$MAKE_LATEST" == true ]]; then
            args+=(--prerelease=false --latest)
          fi
          gh "${args[@]}"

      - name: Verify published release inventory and classification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
        run: |
          set -euo pipefail
          bash scripts/check-release-assets.sh --verify "$GITHUB_REPOSITORY" "$TAG" release-assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > /tmp/published-release.json
          test "$(jq -r .isDraft /tmp/published-release.json)" = false
          test "$(jq -r .isPrerelease /tmp/published-release.json)" = "$PRERELEASE"

  release-security:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Release artifact security
    needs: [release-ref, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}

      - name: Download Linux build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: s-ui-linux-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict s-ui-linux-*.sha256

      - name: Generate SPDX SBOMs for every release archive
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b # main 2026-07-21
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/s-ui-release.spdx.json
          artifact-name: s-ui-release-sbom
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.48.0

      - name: Scan release assets for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master 2026-07-21
        with:
          scan-type: fs
          scan-ref: release-assets
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.72.0

      - name: Attest release artifact provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # main 2026-07-21
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.spdx.json

      - name: Attach offline provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/s-ui-release-attestation.json

      - name: Upload verified release security assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-assets
          path: |
            release-assets/*.spdx.json
            release-assets/*-attestation.json
          if-no-files-found: error
          retention-days: 1
