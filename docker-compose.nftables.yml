# Opt-in only, on a Linux Docker host: grants the single capability needed for
# nftables/transparent-proxy rules. It does not select an emulated architecture,
# run as root/privileged, or add host devices.
# Usage: docker compose -f docker-compose.yml -f docker-compose.nftables.yml --profile nftables up -d
services:
  s-ui:
    profiles: ["nftables"]
    cap_add:
      - NET_ADMIN
